# Reference-only serving notes (not loaded by setup_inference_engines).
# Engines are constructed in inference/setup_inference_engines.py via EngineConfig.
#
# Primary engines (real models, fail-loud unless allow_fallback=true):
#   baseline  -> serving.baseline_hf.HFBaselineEngine
#   vllm      -> serving.vllm_server.VLLMEngine (enable_prefix_caching via EngineConfig)
#
# HF ablations (not Preble/InferCept clusters):
#   hf_prefix_cache  (alias: preble)
#   hf_tool_interrupt (alias: infercept)
#
# Mock: model_name=mock returns deterministic CPU engines for CI.

defaults:
  max_new_tokens: 8
  temperature: 0.0
  warmup: true

engines:
  baseline:
    class: HFBaselineEngine
  vllm:
    class: VLLMEngine
    enable_prefix_caching: true
  hf_prefix_cache:
    class: HFPrefixCacheEngine
  hf_tool_interrupt:
    class: HFToolInterruptEngine
